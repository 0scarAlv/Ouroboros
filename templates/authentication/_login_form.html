{% load form_tags %}

<form
    hx-post="{% url 'login' %}"
    hx-target="this"
    hx-swap="outerHTML"
    novalidate
>
    {% csrf_token %}

    {% render_field form.username %}
    {% render_field form.password %}

    <div class="d-grid mt-3">
        <button type="submit" class="btn btn-dark">
            Ingresar
        </button>
    </div>

</form>
