{% load form_tags %}

<div class="border-top px-3 pt-3 pb-2">
    <form
        hx-post="{% url 'inventory:category-create' %}"
        hx-target="#form-panel"
        hx-swap="innerHTML"
    >
        {% csrf_token %}
        <div class="row g-3 align-items-end">
            <div class="col">
                <label class="form-label">Nombre</label>
                {% render_field form.name %}
            </div>
            <div class="col">
                <label class="form-label">Slug</label>
                {% render_field form.slug %}
            </div>
            <div class="col">
                <label class="form-label">Descripción</label>
                {% render_field form.description %}
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary btn-sm">Guardar</button>
                <button type="button" class="btn btn-outline-secondary btn-sm ms-1"
                        onclick="document.getElementById('form-panel').innerHTML=''">
                    Cancelar
                </button>
            </div>
        </div>
    </form>
</div>
