{% extends "base.html" %}

{% block title %}Eliminar Categoría{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-header py-2">
                <span style="font-size:13px; font-weight:600;">Eliminar categoría</span>
            </div>
            <div class="card-body p-3">
                <p style="font-size:13px;">
                    ¿Estás seguro que deseas eliminar <strong>{{ object.name }}</strong>?
                    Esta acción no se puede deshacer.
                </p>
                <form method="post"
                      hx-post="{{ request.path }}"
                      hx-target="body">
                    {% csrf_token %}
                    <div class="d-flex gap-2 justify-content-end">
                        <a href="{% url 'inventory:category-list' %}"
                           class="btn btn-outline-secondary btn-sm">Cancelar</a>
                        <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
