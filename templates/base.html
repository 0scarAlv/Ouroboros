{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ouroboros{% endblock %}</title>
    <!-- Vendored assets (kernel/static/vendor): the app must work offline. -->
    <link href="{% static 'vendor/bootstrap/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'vendor/material-symbols/material-symbols.css' %}" rel="stylesheet">
    <script src="{% static 'vendor/htmx/htmx.min.js' %}" defer></script>
    <script src="{% static 'vendor/alpinejs/alpine.min.js' %}" defer></script>
    <link href="{% static 'css/styles.css' %}" rel="stylesheet">
    {% block extra_css %}{% endblock %}
    
</head>

<body class="bg-light">

    <div class="d-flex">

        {% if request.user.is_authenticated %}
            {% include "_sidebar.html" %}
        {% endif %}

        <div class="flex-grow-1 d-flex flex-column">
            <main class="container-fluid py-4 px-4">
                {% block content %}{% endblock %}
            </main>
        </div>

    </div>

    <!--
        Fixed in bottom-end corner.
        Toasts are injected here dynamically by the JS below.
        Any view can trigger a toast via HX-Trigger response header.
    -->
    <div
        id="toast-container"
        class="toast-container position-fixed bottom-0 end-0 p-3"
        style="z-index: 9999;"
    ></div>

    <script src="{% static 'vendor/bootstrap/bootstrap.bundle.min.js' %}"></script>

    <!-- Toast system -->
    <script src="{% static 'js/main.js' %}"></script>

    {% block extra_js %}{% endblock %}

</body>
</html>
