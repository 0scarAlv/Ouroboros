<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ouroboros{% endblock %}</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    {% block extra_css %}{% endblock %}
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark px-4">
        <a class="navbar-brand fw-bold" href="/">Ouroboros</a>
        {% block navbar_extra %}{% endblock %}
    </nav>
    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>
    <!--
        Fixed in bottom-end corner.
        Toasts are injected here dynamically by the JS below.
        Any view can trigger a toast via HX-Trigger response header.
    -->
    <div
        id="toast-container"
        class="toast-container position-fixed bottom-0 end-0 p-3"
        style="z-index: 9999;"
    ></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://unpkg.com/htmx.org@1.9.12"></script>

    <!-- Toast system -->
    <script>
        function showToast(message, type = "info") {
            const container = document.getElementById("toast-container");

            // Map type to Bootstrap bg utility class
            const bgClass = {
                success: "bg-success",
                danger:  "bg-danger",
                warning: "bg-warning",
                info:    "bg-info",
            }[type] || "bg-secondary";

            // Build the toast element
            const toastEl = document.createElement("div");
            toastEl.className = `toast align-items-center text-white ${bgClass} border-0`;
            toastEl.setAttribute("role", "alert");
            toastEl.setAttribute("aria-live", "assertive");
            toastEl.setAttribute("aria-atomic", "true");

            toastEl.innerHTML = `
                <div class="d-flex">
                    <div class="toast-body fw-semibold">${message}</div>
                    <button
                        type="button"
                        class="btn-close btn-close-white me-2 m-auto"
                        data-bs-dismiss="toast"
                        aria-label="Close">
                    </button>
                </div>
            `;

            container.appendChild(toastEl);

            // Initialize and show via Bootstrap's Toast API
            const toast = new bootstrap.Toast(toastEl, { delay: 4000 });
            toast.show();

            // Remove from DOM after it hides to avoid accumulation
            toastEl.addEventListener("hidden.bs.toast", () => toastEl.remove());
        }

        /**
         * Listens for HTMX custom event "showToast".
         * Views trigger this via response header:
         *   HX-Trigger: {"showToast": {"message": "Saved", "type": "success"}}
         */
        document.body.addEventListener("showToast", function (event) {
            const { message, type } = event.detail;
            showToast(message, type);
        });
    </script>

    {% block extra_js %}{% endblock %}

</body>
</html>
