<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ouroboros{% endblock %}</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >
    {% block extra_css %}{% endblock %}
</head>

<body class="bg-light">

    <div class="d-flex">

        {% if request.user.is_authenticated %}
            {% include "_sidebar.html" %}
        {% endif %}

        <div class="flex-grow-1 d-flex flex-column">
            <main class="container-fluid py-4 px-4">
                {% block content %}{% endblock %}
            </main>
        </div>

    </div>

    <!--
        Fixed in bottom-end corner.
        Toasts are injected here dynamically by the JS below.
        Any view can trigger a toast via HX-Trigger response header.
    -->
    <div
        id="toast-container"
        class="toast-container position-fixed bottom-0 end-0 p-3"
        style="z-index: 9999;"
    ></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>

    <!-- Toast system -->
    <script>
        function showToast(message, type = "info") {
            const container = document.getElementById("toast-container");

            // Map type to Bootstrap bg utility class
            const bgClass = {
                success: "bg-success",
                danger:  "bg-danger",
                warning: "bg-warning",
                info:    "bg-info",
            }[type] || "bg-secondary";

            const toastEl = document.createElement("div");
            toastEl.className = `toast align-items-center text-white ${bgClass} border-0`;
            toastEl.setAttribute("role", "alert");
            toastEl.setAttribute("aria-live", "assertive");
            toastEl.setAttribute("aria-atomic", "true");

            toastEl.innerHTML = `
                <div class="d-flex">
                    <div class="toast-body fw-semibold">${message}</div>
                    <button
                        type="button"
                        class="btn-close btn-close-white me-2 m-auto"
                        data-bs-dismiss="toast"
                        aria-label="Close">
                    </button>
                </div>
            `;

            container.appendChild(toastEl);

            const toast = new bootstrap.Toast(toastEl, { delay: 4000 });
            toast.show();

            toastEl.addEventListener("hidden.bs.toast", () => toastEl.remove());
        }

        // Listens for HTMX showToast event triggered via HX-Trigger response header
        document.body.addEventListener("showToast", function (event) {
            const { message, type } = event.detail;
            showToast(message, type);
        });
    </script>

    {% block extra_js %}{% endblock %}

</body>
</html>
