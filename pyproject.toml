[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
testpaths = ["kernel", "apps"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "slow: runs in a separate process (deselect with -m 'not slow')",
]

[tool.coverage.run]
source = ["kernel", "apps"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
